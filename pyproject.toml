[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "influenza-ha-analysis"
version = "0.1.0"
description = "Reproducible comparative genomic analysis and UPGMA tree construction for influenza HA sequences"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

